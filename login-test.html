<!DOCTYPE html>
<html>
<head>
    <title>ToolLink Login Test</title>
</head>
<body>
    <h1>ToolLink Login Test</h1>
    <form id="loginForm">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" value="admin@toollink.com" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" value="admin123" required>
        </div>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('Testing login to http://localhost:5001/api/auth/login');
                
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                console.log('Response status:', response.status);
                console.log('Response data:', data);
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h2>✅ Login Successful!</h2>
                        <p><strong>User:</strong> ${data.user?.name || 'Unknown'}</p>
                        <p><strong>Role:</strong> ${data.user?.role || 'Unknown'}</p>
                        <p><strong>Token:</strong> ${data.accessToken ? 'Received' : 'Missing'}</p>
                        
                        <h3>Testing protected endpoint...</h3>
                    `;
                    
                    // Test protected endpoint
                    const userResponse = await fetch('http://localhost:5001/api/users', {
                        headers: {
                            'Authorization': `Bearer ${data.accessToken}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const userData = await userResponse.json();
                    console.log('Users data:', userData);
                    
                    if (userData.success) {
                        resultDiv.innerHTML += `<p>✅ Users data fetched successfully: ${userData.data?.length || 0} users</p>`;
                    } else {
                        resultDiv.innerHTML += `<p>❌ Failed to fetch users: ${userData.error}</p>`;
                    }
                    
                } else {
                    resultDiv.innerHTML = `
                        <h2>❌ Login Failed</h2>
                        <p><strong>Error:</strong> ${data.message || 'Unknown error'}</p>
                        <p><strong>Error Type:</strong> ${data.errorType || 'Unknown'}</p>
                    `;
                }
                
            } catch (error) {
                console.error('Login test error:', error);
                resultDiv.innerHTML = `
                    <h2>❌ Network Error</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check if the backend server is running on http://localhost:5001</p>
                `;
            }
        });
    </script>
</body>
</html>
