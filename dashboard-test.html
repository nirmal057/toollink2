<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard Direct Test</title>
</head>

<body>
    <h1>Admin Dashboard API Test</h1>
    <div id="output"></div>
    <button onclick="testDashboardData()">Test Dashboard Data Loading</button>

    <script>
        async function testDashboardData() {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Testing Admin Dashboard Data Loading...</h2>';

            try {
                // Login first
                const loginResponse = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'admin@toollink.com', password: 'admin123' })
                });

                const loginData = await loginResponse.json();
                const token = loginData.accessToken;
                localStorage.setItem('accessToken', token);

                output.innerHTML += '<p>✅ Login successful</p>';

                // Test IntegratedDataService manually
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                };

                output.innerHTML += '<p>📡 Fetching APIs...</p>';

                // Fetch all APIs
                const [usersResponse, inventoryResponse, ordersResponse, deliveriesResponse] = await Promise.all([
                    fetch('http://localhost:5001/api/users', { headers }),
                    fetch('http://localhost:5001/api/inventory', { headers }),
                    fetch('http://localhost:5001/api/orders', { headers }),
                    fetch('http://localhost:5001/api/delivery', { headers })
                ]);

                output.innerHTML += `<p>API Status: Users:${usersResponse.status}, Inventory:${inventoryResponse.status}, Orders:${ordersResponse.status}, Delivery:${deliveriesResponse.status}</p>`;

                // Parse responses
                const usersData = await usersResponse.json();
                const inventoryData = await inventoryResponse.json();
                const ordersData = await ordersResponse.json();
                const deliveriesData = await deliveriesResponse.json();

                // Extract data
                const users = usersData.data || [];
                const inventory = inventoryData.data?.items || [];
                const orders = ordersData.data || [];
                const deliveries = deliveriesData.data || [];

                output.innerHTML += `<h3>Extracted Data:</h3>`;
                output.innerHTML += `<p>👥 Users: ${users.length}</p>`;
                output.innerHTML += `<p>📦 Inventory: ${inventory.length}</p>`;
                output.innerHTML += `<p>🛒 Orders: ${orders.length}</p>`;
                output.innerHTML += `<p>🚚 Deliveries: ${deliveries.length}</p>`;

                // Test analytics calculation
                const totalUsers = users.length;
                const activeUsers = users.filter(user => user.isActive).length;
                const totalOrders = orders.length;
                const completedOrders = orders.filter(order => order.status === 'delivered').length;

                output.innerHTML += `<h3>Analytics:</h3>`;
                output.innerHTML += `<p>Total Users: ${totalUsers}</p>`;
                output.innerHTML += `<p>Active Users: ${activeUsers}</p>`;
                output.innerHTML += `<p>Total Orders: ${totalOrders}</p>`;
                output.innerHTML += `<p>Completed Orders: ${completedOrders}</p>`;

                // Simulate dashboard data creation
                const dashboardData = {
                    userStats: {
                        total: totalUsers,
                        active: activeUsers,
                        pending: users.filter(u => !u.isActive).length,
                        inactive: totalUsers - activeUsers
                    },
                    analytics: {
                        totalOrders: totalOrders,
                        completedOrders: completedOrders,
                        orderSuccessRate: totalOrders > 0 ? Math.round((completedOrders / totalOrders) * 100) : 0
                    }
                };

                output.innerHTML += `<h3>Dashboard Data:</h3>`;
                output.innerHTML += `<pre>${JSON.stringify(dashboardData, null, 2)}</pre>`;

                output.innerHTML += '<h2>✅ Dashboard data test complete!</h2>';

            } catch (error) {
                output.innerHTML += `<h2>❌ Error: ${error.message}</h2>`;
                console.error('Dashboard test error:', error);
            }
        }
    </script>
</body>

</html>
