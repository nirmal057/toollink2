<!DOCTYPE html>
<html>

<head>
    <title>ToolLink Admin Dashboard Debug</title>
</head>

<body>
    <h1>ToolLink Admin Dashboard Debug Test</h1>
    <div id="status"></div>
    <div id="results"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        async function debugAdminDashboard() {
            try {
                statusDiv.innerHTML = '<p>🔍 Starting admin dashboard debug...</p>';

                // Step 1: Test authentication
                statusDiv.innerHTML += '<p>1️⃣ Testing authentication...</p>';

                const loginResponse = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@toollink.com',
                        password: 'admin123'
                    })
                });

                const loginData = await loginResponse.json();

                if (!loginData.success) {
                    statusDiv.innerHTML += '<p>❌ Login failed: ' + loginData.error + '</p>';
                    return;
                }

                statusDiv.innerHTML += '<p>✅ Login successful</p>';
                const token = loginData.accessToken;

                // Step 2: Test all API endpoints that AdminDashboard uses
                statusDiv.innerHTML += '<p>2️⃣ Testing API endpoints...</p>';

                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                };

                // Test endpoints
                const endpoints = [
                    { name: 'Users', url: 'http://localhost:5001/api/users' },
                    { name: 'Inventory', url: 'http://localhost:5001/api/inventory' },
                    { name: 'Orders', url: 'http://localhost:5001/api/orders' },
                    { name: 'Delivery', url: 'http://localhost:5001/api/delivery' }
                ];

                for (const endpoint of endpoints) {
                    try {
                        statusDiv.innerHTML += `<p>Testing ${endpoint.name}...</p>`;

                        const response = await fetch(endpoint.url, { headers });
                        const data = await response.json();

                        if (response.ok && data.success) {
                            const dataLength = Array.isArray(data.data) ? data.data.length :
                                data.data?.items ? data.data.items.length : 'Unknown';
                            statusDiv.innerHTML += `<p>✅ ${endpoint.name}: Success (${dataLength} items)</p>`;
                        } else {
                            statusDiv.innerHTML += `<p>❌ ${endpoint.name}: Failed - ${data.error || 'Unknown error'}</p>`;
                        }
                    } catch (error) {
                        statusDiv.innerHTML += `<p>❌ ${endpoint.name}: Network error - ${error.message}</p>`;
                    }
                }

                // Step 3: Test IntegratedDataService simulation
                statusDiv.innerHTML += '<p>3️⃣ Testing integrated data service simulation...</p>';

                try {
                    const [usersRes, inventoryRes, ordersRes, deliveryRes] = await Promise.all([
                        fetch('http://localhost:5001/api/users', { headers }),
                        fetch('http://localhost:5001/api/inventory', { headers }),
                        fetch('http://localhost:5001/api/orders', { headers }),
                        fetch('http://localhost:5001/api/delivery', { headers })
                    ]);

                    const [usersData, inventoryData, ordersData, deliveryData] = await Promise.all([
                        usersRes.json(),
                        inventoryRes.json(),
                        ordersRes.json(),
                        deliveryRes.json()
                    ]);

                    // Simulate the same logic as IntegratedDataService
                    const users = usersData.data || [];
                    const inventory = inventoryData.data?.items || [];
                    const orders = ordersData.data || [];
                    const deliveries = deliveryData.data || [];

                    statusDiv.innerHTML += `<p>✅ Integrated data collected:</p>`;
                    statusDiv.innerHTML += `<p>👥 Users: ${users.length}</p>`;
                    statusDiv.innerHTML += `<p>📦 Inventory: ${inventory.length}</p>`;
                    statusDiv.innerHTML += `<p>🛒 Orders: ${orders.length}</p>`;
                    statusDiv.innerHTML += `<p>🚚 Deliveries: ${deliveries.length}</p>`;

                    // Test if admin dashboard should work
                    if (users.length > 0 && inventory.length > 0) {
                        statusDiv.innerHTML += '<p>🎉 Admin dashboard should work with this data!</p>';

                        // Show sample data structure
                        resultsDiv.innerHTML = `
                            <h2>Sample Data Structure:</h2>
                            <h3>Sample User:</h3>
                            <pre>${JSON.stringify(users[0], null, 2)}</pre>
                            <h3>Sample Inventory Item:</h3>
                            <pre>${JSON.stringify(inventory[0], null, 2)}</pre>
                        `;
                    } else {
                        statusDiv.innerHTML += '<p>⚠️ Missing critical data for admin dashboard</p>';
                    }

                } catch (error) {
                    statusDiv.innerHTML += `<p>❌ Integrated data test failed: ${error.message}</p>`;
                }

                statusDiv.innerHTML += '<p>🏁 Debug complete!</p>';

            } catch (error) {
                statusDiv.innerHTML += `<p>💥 Debug failed: ${error.message}</p>`;
                console.error('Debug error:', error);
            }
        }

        // Start debug automatically
        debugAdminDashboard();
    </script>
</body>

</html>
