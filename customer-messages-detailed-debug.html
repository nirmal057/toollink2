<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Messages Debug - Detailed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
        }

        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Customer Messages Page Debug</h1>

        <div class="info result">
            <h3>Testing Why Customer Messages Page Isn't Working</h3>
            <p>Let's debug step by step to find the exact issue.</p>
        </div>

        <h3>Step 1: Login and Get Token</h3>
        <button onclick="loginAndGetToken()">Login as Admin</button>
        <div id="loginResult"></div>

        <h3>Step 2: Test Backend API Response</h3>
        <button onclick="testBackendAPI()">Test Authenticated Messages API</button>
        <div id="apiResult"></div>

        <h3>Step 3: Test Frontend Component</h3>
        <button onclick="testFrontendIntegration()">Test Frontend API Call</button>
        <div id="frontendResult"></div>

        <h3>Step 4: Direct Page Access</h3>
        <button onclick="openMessagesPage()">Open Admin Messages Page</button>
        <p><small>Check browser console for errors</small></p>
    </div>

    <script>
        let adminToken = null;

        async function loginAndGetToken() {
            const resultDiv = document.getElementById('loginResult');
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@toollink.com',
                        password: 'admin123'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    adminToken = data.data.accessToken;
                    localStorage.setItem('accessToken', adminToken);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    resultDiv.innerHTML = `
                        <div class="success result">
                            <h4>✅ Login Successful!</h4>
                            <p><strong>User:</strong> ${data.data.user.email}</p>
                            <p><strong>Role:</strong> ${data.data.user.role}</p>
                            <p><strong>Token:</strong> ${adminToken.substring(0, 50)}...</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error result">❌ Login failed: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error result">❌ Login error: ${error.message}</div>`;
            }
        }

        async function testBackendAPI() {
            const resultDiv = document.getElementById('apiResult');
            if (!adminToken) {
                resultDiv.innerHTML = '<div class="error result">❌ Please login first</div>';
                return;
            }

            try {
                // Test the exact endpoint the frontend uses
                const response = await fetch('http://localhost:5000/api/messages', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                resultDiv.innerHTML = `
                    <div class="${data.success ? 'success' : 'error'} result">
                        <h4>${data.success ? '✅' : '❌'} Backend API Response</h4>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Success:</strong> ${data.success}</p>
                        ${data.success ? `
                            <p><strong>Messages Count:</strong> ${data.data?.messages?.length || 'No messages array'}</p>
                            <p><strong>Structure:</strong></p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        ` : `
                            <p><strong>Error:</strong> ${data.error}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error result">
                        <h4>❌ API Request Failed</h4>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testFrontendIntegration() {
            const resultDiv = document.getElementById('frontendResult');
            if (!adminToken) {
                resultDiv.innerHTML = '<div class="error result">❌ Please login first</div>';
                return;
            }

            try {
                // Simulate the frontend axios call
                const response = await fetch('http://localhost:5000/api/messages', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const rawData = await response.json();

                // Check what the CustomerMessages component expects
                let messages = [];
                if (rawData.success) {
                    // The component expects: response.data.data
                    // But backend might return: response.data.messages or just response.data
                    messages = rawData.data?.messages || rawData.data || [];
                }

                resultDiv.innerHTML = `
                    <div class="info result">
                        <h4>🔍 Frontend Integration Analysis</h4>
                        <p><strong>Raw Response:</strong></p>
                        <pre>${JSON.stringify(rawData, null, 2)}</pre>

                        <p><strong>What Component Gets:</strong></p>
                        <pre>response.data.data = ${JSON.stringify(rawData.data, null, 2)}</pre>

                        <p><strong>Messages Array:</strong></p>
                        <pre>${JSON.stringify(messages, null, 2)}</pre>

                        <p><strong>Expected by Component:</strong> Array in response.data.data</p>
                        <p><strong>Actual Structure:</strong> ${typeof rawData.data}</p>

                        ${messages.length > 0 ?
                        `<div class="success result">✅ Messages found: ${messages.length}</div>` :
                        `<div class="error result">❌ No messages in expected structure</div>`
                    }
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error result">
                        <h4>❌ Frontend Test Failed</h4>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        function openMessagesPage() {
            window.open('http://localhost:5173/admin/messages', '_blank');
        }
    </script>
</body>

</html>
