<!DOCTYPE html>
<html>
<head>
    <title>IntegratedDataService Test</title>
</head>
<body>
    <h1>IntegratedDataService Test</h1>
    <div id="output"></div>

    <script>
        // Test the IntegratedDataService directly
        async function testIntegratedDataService() {
            const output = document.getElementById('output');
            
            try {
                // Get token first
                const loginResponse = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'admin@toollink.com', password: 'admin123' })
                });
                
                const loginData = await loginResponse.json();
                const token = loginData.accessToken;
                
                // Store token for the service
                localStorage.setItem('accessToken', token);
                
                output.innerHTML += '<h2>✅ Login successful</h2>';
                
                // Test fetching integrated data
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                };

                // Fetch all data
                const [usersResponse, inventoryResponse, ordersResponse, deliveriesResponse] = await Promise.all([
                    fetch('http://localhost:5001/api/users', { headers }),
                    fetch('http://localhost:5001/api/inventory', { headers }),
                    fetch('http://localhost:5001/api/orders', { headers }),
                    fetch('http://localhost:5001/api/delivery', { headers })
                ]);

                const usersData = await usersResponse.json();
                const inventoryData = await inventoryResponse.json();
                const ordersData = await ordersResponse.json();
                const deliveriesData = await deliveriesResponse.json();

                // Extract data arrays
                const users = usersData.data || [];
                const inventory = inventoryData.data?.items || [];
                const orders = ordersData.data || [];
                const deliveries = deliveriesData.data || [];

                output.innerHTML += `<h2>Data Fetched Successfully:</h2>`;
                output.innerHTML += `<p>👥 Users: ${users.length}</p>`;
                output.innerHTML += `<p>📦 Inventory Items: ${inventory.length}</p>`;
                output.innerHTML += `<p>🛒 Orders: ${orders.length}</p>`;
                output.innerHTML += `<p>🚚 Deliveries: ${deliveries.length}</p>`;
                
                // Test analytics calculation
                const activeUsers = users.filter(user => user.isActive).length;
                const completedOrders = orders.filter(order => order.status === 'delivered').length;
                const totalInventoryValue = inventory.reduce((sum, item) => 
                    sum + (item.current_stock || 0) * (item.selling_price || 0), 0);
                
                output.innerHTML += `<h2>Analytics:</h2>`;
                output.innerHTML += `<p>Active Users: ${activeUsers}/${users.length}</p>`;
                output.innerHTML += `<p>Completed Orders: ${completedOrders}/${orders.length}</p>`;
                output.innerHTML += `<p>Total Inventory Value: $${totalInventoryValue.toLocaleString()}</p>`;
                
                // Show sample data
                output.innerHTML += `<h2>Sample Data:</h2>`;
                if (users.length > 0) {
                    output.innerHTML += `<p>First User: ${users[0].fullName} (${users[0].role})</p>`;
                }
                if (inventory.length > 0) {
                    output.innerHTML += `<p>First Item: ${inventory[0].name} - Stock: ${inventory[0].current_stock}</p>`;
                }
                if (orders.length > 0) {
                    output.innerHTML += `<p>First Order: ${orders[0].orderNumber} - Status: ${orders[0].status}</p>`;
                }
                
                output.innerHTML += '<h2>✅ IntegratedDataService Test Complete!</h2>';
                
            } catch (error) {
                output.innerHTML += `<h2>❌ Error: ${error.message}</h2>`;
                console.error('Test error:', error);
            }
        }

        // Run test when page loads
        testIntegratedDataService();
    </script>
</body>
</html>
